volumes:
  local_postgres_data: {}
  local_postgres_data_backups: {}
  data1-1:
  data1-2:
  data2-1:
  data2-2:
  data3-1:
  data3-2:
  data4-1:
  data4-2:

x-minio-common: &minio-common
  image: quay.io/minio/minio:latest
  command: server --console-address ":9001" http://minio{1...4}/data{1...2}
  expose:
    - "9000"
    - "9001"
  environment:
    MINIO_ROOT_USER: abcd
    MINIO_ROOT_PASSWORD: abcd2345
  healthcheck:
    test: ["CMD", "mc", "ready", "local"]
    interval: 5s
    timeout: 5s
    retries: 5

services:
  call_analyzer_django: &call_analyzer_django
    build:
      context: ./call_analyzer_api
      dockerfile: ./docker/compose/local/django/Dockerfile
    image: call_analyzer_django
    depends_on:
      - postgres
    volumes:
      - ./call_analyzer_api:/app
    env_file:
      - ./call_analyzer_api/.envs/.local/.django
      - ./call_analyzer_api/.envs/.local/.postgres
    ports:
      - "8000:8000"
    command: /start

  call_analyzer_web:
    build:
      context: ./call_analyzer_web
      dockerfile: ./docker/compose/local/Dockerfile
    image: call_analyzer_web
    depends_on:
      - call_analyzer_django
    volumes:
      - ./call_analyzer_web:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    command: yarn dev -H 0.0.0.0

  postgres:
    build:
      context: ./call_analyzer_api
      dockerfile: ./docker/compose/local/postgres/Dockerfile
    image: call_analyzer_postgres
    volumes:
      - "${POSTGRES_DATA_PATH}:/var/lib/postgresql/data"
      - "${POSTGRES_DATA_BACKUPS_PATH}:/backups"
    env_file:
      - ./call_analyzer_api/.envs/.local/.postgres
    ports:
      - "5432:5432"

  redis:
    image: redis:8.0-alpine
    ports:
      - "6379:6379"

  celeryworker:
    <<: *call_analyzer_django
    image: call_analyzer_celeryworker
    depends_on:
      - redis
      - postgres
    ports: []
    command: /start-celeryworker

  celerybeat:
    <<: *call_analyzer_django
    image: call_analyzer_celerybeat
    depends_on:
      - redis
      - postgres
    ports: []
    command: /start-celerybeat

  minio1:
    <<: *minio-common
    hostname: minio1
    volumes:
      - data1-1:/data1
      - data1-2:/data2

  minio2:
    <<: *minio-common
    hostname: minio2
    volumes:
      - data2-1:/data1
      - data2-2:/data2

  minio3:
    <<: *minio-common
    hostname: minio3
    volumes:
      - data3-1:/data1
      - data3-2:/data2

  minio4:
    <<: *minio-common
    hostname: minio4
    volumes:
      - data4-1:/data1
      - data4-2:/data2

  nginx:
    image: nginx:1.19.2-alpine
    hostname: nginx
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "9000:9000"
      - "9001:9001"
    depends_on:
      - minio1
      - minio2
      - minio3
      - minio4

  createbuckets:
    image: minio/mc
    depends_on:
      - nginx
    entrypoint: >
      /bin/sh -c "
      until mc alias set myminio http://nginx:9000 abcd abcd2345; do echo 'waiting for minio...' && sleep 1; done;
      mc mb myminio/temp || true;
      mc mb myminio/uploaded_files || true;
      mc mb myminio/transcriptions || true;
      exit 0;
      "
